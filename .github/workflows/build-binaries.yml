name: build-binaries

# Builds `said` (CLI) + `said-mcp` + the `said-orchestrate` coding orchestrator for
# Linux / Windows / macOS in four feature bundles. The encoder model is committed in
# this repo (SAID-LAM-private/said-lam-static) AND baked into every binary via the
# `embed-model` feature, so each artifact is a self-contained portable brain.
#
#   brain        portable brain only (embed-model)                — said + said-mcp
#   coding       brain + code intelligence            (embed-model, code)        + said-orchestrate
#   coding-plus  coding + LSP                          (embed-model, code, lsp)   + said-orchestrate
#   full         code + docs + OCR + LSP               (embed-model, code, docs, ocr, lsp) + said-orchestrate
#
# said-orchestrate ships in every CODING bundle (not bare `brain`): it's the closed-loop
# coding driver (plan/design/code/test/repair) and uses its own default features
# (embed-model + pack-sign), so it's self-contained with semantic recall + signed-pack
# verification. The bare `brain` bundle stays minimal (CLI + MCP only).
#
# Built with --no-default-features so each bundle is exactly its feature set.
# Runs on tag push (v*) or manual dispatch. No secrets/tokens needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.bundle }}-${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two real axes → full cross-product = 4 bundles × 3 OSes = 12 jobs.
        bundle: [brain, coding, coding-plus, full]
        target:
          - { name: linux-x64,   os: ubuntu-22.04,   cli: said,     mcp: said-mcp,     orch: said-orchestrate }
          - { name: windows-x64, os: windows-latest, cli: said.exe, mcp: said-mcp.exe, orch: said-orchestrate.exe }
          - { name: macos-arm64, os: macos-14,       cli: said,     mcp: said-mcp,     orch: said-orchestrate }
    steps:
      - uses: actions/checkout@v5
      - name: Verify encoder present (real bytes)
        shell: bash
        run: |
          f=SAID-LAM-private/said-lam-static/model.safetensors
          test -f "$f" && test "$(wc -c < "$f")" -gt 1000000 || { echo "::error::encoder missing/pointer"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.bundle }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake clang libssl-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Windows deps (cmake for OCR)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
      - name: Build said CLI (${{ matrix.bundle }})
        run: cargo build --release -p said-cli --no-default-features --features "${{ matrix.bundle }}"
      - name: Build said-mcp (${{ matrix.bundle }})
        run: cargo build --release -p said-mcp --no-default-features --features "${{ matrix.bundle }}"
      # The coding orchestrator ships in every CODING bundle (not bare `brain`). It uses
      # its OWN default features (embed-model + pack-sign), independent of the bundle
      # feature axis, so it's a self-contained coding driver wherever it ships.
      - name: Build said-orchestrate (coding bundles)
        if: matrix.bundle != 'brain'
        run: cargo build --release -p said-orchestration --bin said-orchestrate
      - name: Smoke test (CLI runs)
        shell: bash
        run: ./target/release/${{ matrix.target.cli }} --version
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.target.cli }}" "target/release/${{ matrix.target.mcp }}" dist/
          if [ "${{ matrix.bundle }}" != "brain" ]; then
            cp "target/release/${{ matrix.target.orch }}" dist/
          fi
          # Bundle a README (+ LICENSE if present) into every archive — the world-class norm
          # (goreleaser/ripgrep/gh): the download is self-orienting and points to the full online
          # guides, without carrying the whole doc tree. Brain gets its tailored README.
          if [ -f packaging/bundle-readme-brain.md ]; then
            cp packaging/bundle-readme-brain.md dist/README.md
          fi
          [ -f LICENSE ] && cp LICENSE dist/ || true
          ls -la dist

      # ── Native installers (per OS). GitHub builds the packages for us on tag push; no local
      #    packaging toolchains needed. Unsigned for now — signing/notarisation is the CIRCLE_PLAN
      #    distribution step (needs Apple Developer ID / Authenticode certs). Packages land in dist/
      #    alongside the raw binaries and are uploaded as part of the same artifact.
      - name: Package — Linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER="$(./dist/said --version | awk '{print $NF}')"
          bash packaging/build-deb.sh "$VER" dist/said dist/said-mcp dist
      - name: Package — macOS .pkg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER="$(./dist/said --version | awk '{print $NF}')"
          bash packaging/build-macos-pkg.sh "$VER" dist/said dist/said-mcp dist
      - name: Package — Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (& .\dist\said.exe --version).Split(' ')[-1]
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" "/DBinDir=$(Resolve-Path dist)" `
            "/O$(Resolve-Path dist)" packaging\windows\said.iss

      - uses: actions/upload-artifact@v5
        with:
          name: said-${{ matrix.bundle }}-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: artifacts }
      # Zip each bundle-target (raw binaries + its native installer) …
      - run: cd artifacts && for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      # … and lift the native installers OUT to the release root as first-class downloads,
      # so a user can grab `said_<ver>_amd64.deb` / `said-setup-*.exe` / `said-*.pkg` directly.
      - name: Collect native installers
        run: |
          mkdir -p release
          cp artifacts/*.zip release/ 2>/dev/null || true
          find artifacts -type f \( -name '*.deb' -o -name '*.pkg' -o -name 'said-setup-*.exe' \) \
            -exec cp {} release/ \;
          # the one-line install scripts (curl … | sh  /  irm … | iex resolve to these)
          cp packaging/install.sh packaging/install.ps1 release/
          ls -la release
      - uses: softprops/action-gh-release@v2
        with: { files: release/* }
