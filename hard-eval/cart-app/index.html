<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Said Shop — Interactive Cart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🛒 Said Shop</h1>
    <p class="tag">A real interactive cart — built by a Claude agent using <code>.said</code> as memory.</p>
  </header>

  <main>
    <section class="catalog">
      <h2>Products</h2>
      <div id="products" class="grid"></div>
    </section>

    <aside class="cart">
      <h2>Your Cart</h2>
      <ul id="cart-lines" class="lines"></ul>

      <div class="coupon">
        <input id="coupon-code" placeholder="Coupon code (e.g. SAVE10)" />
        <button id="apply-coupon">Apply</button>
        <div id="coupon-msg" class="msg"></div>
      </div>

      <div class="totals">
        <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="row"><span>Discount</span><span id="discount">-$0.00</span></div>
        <div class="row"><span>Tax (10%)</span><span id="tax">$0.00</span></div>
        <div class="row total"><span>Total</span><span id="total">$0.00</span></div>
      </div>

      <button id="checkout" class="checkout">Checkout</button>
      <div id="receipt" class="receipt"></div>
    </aside>
  </main>

  <script src="cart.js"></script>
  <script src="app.js"></script>
</body>
</html>
