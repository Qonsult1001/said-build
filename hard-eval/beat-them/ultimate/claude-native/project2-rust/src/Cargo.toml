[workspace]
members = [
    "core",
    "accounts",
    "coverage",
    "search",
    "products",
    "api",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
