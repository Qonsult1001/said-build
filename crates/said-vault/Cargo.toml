[package]
name = "said-vault"
version = "0.1.0"
edition = "2024"
description = "Enterprise document vault on a .said file backend"

[dependencies]
sca-core = { path = "../sca-core" }
blake3 = "1.5"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
quick-xml = "0.31"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
lopdf = "0.40"
regex = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
hex = "0.4"
unicode-normalization = "0.1"
# Byte-exact DEFLATE reconstruction for the legal-tier recipe codec.
preflate-rs = "0.7"

[dev-dependencies]
tempfile = "3"
