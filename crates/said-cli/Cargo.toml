[package]
name = "said-cli"
version = "0.2.0"
edition = "2021"
description = "CLI for .said portable brain files — add, query, get in one binary"

[[bin]]
name = "said"
path = "src/main.rs"

[dependencies]
sca-core = { path = "../sca-core", features = ["static-embed"] }
said-vault = { path = "../said-vault" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
pathdiff = "0.2.3"
said-forge = { path = "../said-forge", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }

# Cross-platform config dir lookup (used on non-Windows in resolve.rs).
[target.'cfg(not(target_os = "windows"))'.dependencies]
dirs-next = "2"

[features]
default = []
whisper = ["sca-core/whisper"]
embed-model = ["sca-core/embed-model"]
code = ["sca-core/code"]
lsp = ["sca-core/lsp"]
docs = ["sca-core/docs"]
ocr = ["sca-core/ocr"]
forge = ["dep:said-forge", "dep:tokio"]
# XLSX/XLSM ingest in forge sync (calamine-backed).
forge-xlsx = ["forge", "said-forge/forge-xlsx"]
# Real PDF/DOCX ingest for forge sync (reuses sca-core docs plugin).
forge-docs = ["forge", "docs", "said-forge/forge-docs"]
# Read-only sandbox verification — exposes the `forge docs --verify-against-sandbox`
# code path (tiberius client + axum harness server). Requires `forge`.
forge-sql-verify = ["forge", "said-forge/forge-sql-verify"]

# Release bundle: everything a developer actually wants in one binary.
# Use `cargo build --release --features release` to produce the ship-ready
# `said` binary (code intel + docs + video + model + LSP + forge).
release = ["code", "docs", "ocr", "whisper", "embed-model", "lsp", "forge", "forge-xlsx", "forge-docs"]

# ---------------------------------------------------------------------------
# Shipping bundles. Every bundle bakes the said-lam encoder into the binary
# (embed-model) so each variant is a self-contained, single-file portable
# brain — no external model folder required.
#
#   brain        portable brain only (semantic memory over text you give it)
#   coding       brain + code intelligence (24 languages)
#   coding-plus  coding + LSP cross-file intelligence
#   full         everything readable: code + docs (PDF/DOCX) + OCR + LSP
# ---------------------------------------------------------------------------
brain = ["embed-model"]
coding = ["embed-model", "code"]
coding-plus = ["embed-model", "code", "lsp"]
full = ["embed-model", "code", "docs", "ocr", "lsp"]
