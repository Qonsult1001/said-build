openapi: 3.0.3
info:
  title: Swagger Petstore
  version: 1.0.0
servers:
  - url: https://petstore.swagger.io/v2
paths:
  /pet:
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
    put:
      tags: [pet]
      summary: Update an existing pet
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '200': { description: OK }
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [available, pending, sold] }
      responses:
        '200': { description: OK }
  /pet/findByTags:
    get:
      tags: [pet]
      summary: Finds Pets by tags
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          required: true
          schema: { type: array, items: { type: string } }
      responses:
        '200': { description: OK }
  /pet/{petId}:
    get:
      tags: [pet]
      summary: Find pet by ID
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
    post:
      tags: [pet]
      summary: Updates a pet in the store with form data
      operationId: updatePetWithForm
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
    delete:
      tags: [pet]
      summary: Deletes a pet
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: uploads an image
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status
      operationId: getInventory
      responses:
        '200': { description: OK }
  /store/order:
    post:
      tags: [store]
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '200': { description: OK }
  /store/order/{orderId}:
    get:
      tags: [store]
      summary: Find purchase order by ID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
    delete:
      tags: [store]
      summary: Delete purchase order by ID
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }
  /user:
    post:
      tags: [user]
      summary: Create user
      operationId: createUser
      responses:
        '200': { description: OK }
  /user/createWithArray:
    post:
      tags: [user]
      summary: Creates list of users with given input array
      operationId: createUsersWithArrayInput
      responses:
        '200': { description: OK }
  /user/createWithList:
    post:
      tags: [user]
      summary: Creates list of users with given input list
      operationId: createUsersWithListInput
      responses:
        '200': { description: OK }
  /user/login:
    get:
      tags: [user]
      summary: Logs user into the system
      operationId: loginUser
      responses:
        '200': { description: OK }
  /user/logout:
    get:
      tags: [user]
      summary: Logs out current logged in user session
      operationId: logoutUser
      responses:
        '200': { description: OK }
  /user/{username}:
    get:
      tags: [user]
      summary: Get user by user name
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    put:
      tags: [user]
      summary: Updated user
      operationId: updateUser
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    delete:
      tags: [user]
      summary: Delete user
      operationId: deleteUser
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
components:
  schemas:
    Pet:
      type: object
      required: [name, photoUrls]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        photoUrls: { type: array, items: { type: string } }
        status: { type: string, enum: [available, pending, sold] }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64 }
        petId: { type: integer, format: int64 }
        quantity: { type: integer, format: int32 }
